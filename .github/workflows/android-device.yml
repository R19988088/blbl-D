name: Android Device APK

on:
  push:
    branches: [codex/player-list-toggle]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Decode fixed signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
      - name: Check list selection and build APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --tests blbl.cat3399.feature.player.PlayerCollectionThumbsTest :app:assembleRelease -PversionName=0.1.106 -PversionCode=106
      - uses: actions/upload-artifact@v6
        with:
          name: device-apk
          path: app/build/outputs/apk/release/*.apk
