name: Android Debug

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.1.1)"
        required: true
      changelog:
        description: "Release notes/changelog (optional; supports multiline)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Check signing secrets
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing signing secret::$name is not set. Add it in repository Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "## Missing signing secrets"
              echo ""
              echo "Debug now uses the fixed private signing key, so these repository secrets are required:"
              echo ""
              echo "- RELEASE_KEYSTORE_BASE64"
              echo "- RELEASE_STORE_PASSWORD"
              echo "- RELEASE_KEY_ALIAS"
              echo "- RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
      - name: Build debug APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace -PversionName=${{ inputs.version_name || format('0.1.{0}', github.run_number) }} -PversionCode=${{ github.run_number }} 2>&1 | tee build-debug.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary="$(grep -E "^(e: |ERROR:|FAILURE:|\* What went wrong:|Execution failed|Could not |Caused by:|> )" build-debug.log | tail -n 40)"
            if [ -z "$summary" ]; then
              summary="$(tail -n 40 build-debug.log)"
            fi
            {
              echo "::error title=Debug APK build failed::$(printf '%s' "$summary" | head -n 1)"
              echo "## Debug APK build failed"
              echo ""
              echo '```text'
              printf '%s\n' "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Build error details"
            printf '%s\n' "$summary"
            echo "::endgroup::"
            exit "$status"
          fi
      - name: Upload debug APK to R2 (optional)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX || secrets.R2_PREFIX }}
          VERSION_NAME: ${{ inputs.version_name || format('0.1.{0}', github.run_number) }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "R2 variables not set, skipping upload."
            exit 0
          fi
          if ! command -v aws >/dev/null 2>&1; then
            echo "aws cli not found, installing..."
            sudo apt-get update
            sudo apt-get install -y awscli
          fi

          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_REGION="auto"
          export AWS_EC2_METADATA_DISABLED=true
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          CLEAN_VERSION="${VERSION_NAME#v}"
          APK_PATH="app/build/outputs/apk/debug/blbl-D-${CLEAN_VERSION}-debug.apk"
          KEY_PREFIX="${R2_PREFIX:-blbl}"
          KEY_PREFIX="${KEY_PREFIX%/}"
          if [ -n "${KEY_PREFIX}" ]; then
            KEY_PREFIX="${KEY_PREFIX}/"
          fi
          if [ ! -s CHANGELOG.md ]; then
            echo "CHANGELOG.md missing or empty."
            exit 1
          fi

          printf '%s' "${CLEAN_VERSION}" > version
          aws s3 cp "version" "s3://${R2_BUCKET}/${KEY_PREFIX}version" --endpoint-url "${ENDPOINT}" --content-type "text/plain" --cache-control "no-cache"
          aws s3 cp "CHANGELOG.md" "s3://${R2_BUCKET}/${KEY_PREFIX}CHANGELOG.md" --endpoint-url "${ENDPOINT}" --content-type "text/markdown; charset=utf-8" --cache-control "no-cache"
          aws s3 cp "${APK_PATH}" "s3://${R2_BUCKET}/${KEY_PREFIX}blbl-D-${CLEAN_VERSION}-debug.apk" --endpoint-url "${ENDPOINT}" --content-type "application/vnd.android.package-archive"
          aws s3 cp "${APK_PATH}" "s3://${R2_BUCKET}/${KEY_PREFIX}blbl-D-latest-debug.apk" --endpoint-url "${ENDPOINT}" --content-type "application/vnd.android.package-archive" --cache-control "no-cache"
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/blbl-D-*-debug.apk
      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name || format('0.1.{0}', github.run_number) }}
          RELEASE_TAG: ${{ startsWith(inputs.version_name || format('0.1.{0}', github.run_number), 'v') && (inputs.version_name || format('0.1.{0}', github.run_number)) || format('v{0}', inputs.version_name || format('0.1.{0}', github.run_number)) }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          CLEAN_VERSION="${VERSION_NAME#v}"
          APK_PATH="app/build/outputs/apk/debug/blbl-D-${CLEAN_VERSION}-debug.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ -n "${CHANGELOG:-}" ]; then
              printf '%s' "$CHANGELOG" > changelog.md
              gh release edit "$RELEASE_TAG" --notes-file changelog.md
            fi
          else
            if [ -n "${CHANGELOG:-}" ]; then
              printf '%s' "$CHANGELOG" > changelog.md
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file changelog.md --target "$GITHUB_SHA"
            else
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
            fi
          fi
          gh release upload "$RELEASE_TAG" "${APK_PATH}#blbl-D-${VERSION_NAME}-debug.apk" --clobber
          gh release upload "$RELEASE_TAG" "${APK_PATH}#blbl-D-latest-debug.apk" --clobber
